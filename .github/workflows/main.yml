# .github/workflows/run-turuylevaade-daily.yml
name: run-turuylevaade-daily

on:
  schedule:
    - cron: '5 11 * * *'
  workflow_dispatch: {}

# Käsitsi ja ajastatud jooks ei tohi kattuda: muidu võiks aeglasem vanem
# jooks hiljem uuema tulemuse üle kirjutada.
concurrency:
  group: daily-reports
  cancel-in-progress: false

env:
  ANALYSIS_IMAGE: ghcr.io/iseppo/periodical:main@sha256:0326e4eca962056b9469e372fd1984c0043ae65a261c9b8e933f8508dba1bfba

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Statistikaameti inflatsiooni toorcache — väike (~paar KB) RDS fail,
    # mille NAV_kasv.R kirjutab iga eduka päringu järel ja millest see
    # loeb juhul, kui andmed.stat.ee on 3 katsel kättesaamatu (vt
    # get_inflation_data NAV_kasv.R-is). Iga päevane run salvestab uue
    # snapshot'i unikaalse võtmega; restore-keys "inflation-raw-" toob
    # tagasi värskeima olemasoleva. GitHub kustutab kasutamata cache'i
    # pärast 7 päeva, nii et puhastust pole vaja.
    - name: Restore inflation raw cache
      uses: actions/cache@v5
      with:
        path: cache_inflation_raw.rds
        # v1 prefiks võimaldab edaspidi cache'i invalideerida ühe versiooni-
        # bumbiga, kui RDS-i skeem muutub (nt veerunimed read_raw_cache'is).
        key: inflation-raw-v1-${{ github.run_id }}
        restore-keys: |
          inflation-raw-v1-

    # Pensionikeskuse NAV toorcache — sama muster kui inflatsiooni cache'iga,
    # eraldi võtmega et skeemi muutused saaksid invalideerida ainult ühte
    # või teist (vt read_nav_raw_cache NAV_kasv.R-is). NAV avaldatakse iga
    # tööpäev — sellega seoses on R-poolne max vanus 7 päeva, mitte 45.
    - name: Restore NAV raw cache
      uses: actions/cache@v5
      with:
        path: cache_nav_raw.rds
        key: nav-raw-v1-${{ github.run_id }}
        restore-keys: |
          nav-raw-v1-

    # Turuülevaate cache'id: eelmise jooksu fondide toorandmed (suletud fondide
    # tuvastamiseks ja arhiveerimiseks) ning lõppenud fondivahetuste andmed.
    # Arhiiv on ka siin, et push'i nurjumisel see kaotsi ei läheks (cache'i
    # versioon sisaldab alati commititut). Explicit restore/save, et cache
    # salvestuks ka siis, kui jooks lõpuks punaseks läheb.
    - name: Restore market overview cache
      uses: actions/cache/restore@v5
      with:
        path: |
          cache_ii_fondid.rds
          cache_fund_pev.rds
          data/ii_suletud_fondid.csv
        key: turuylevaade-v1-${{ github.run_id }}
        restore-keys: |
          turuylevaade-v1-

    # Eelmine edukalt avaldatud komplekt: stage.mjs võtab sealt aruanderühma,
    # kui tänane render nurjus (töötav aruanne ei kao saidilt).
    - name: Restore last good site
      uses: actions/cache/restore@v5
      with:
        path: cloudflare/last-good
        key: site-last-good-${{ github.run_id }}
        restore-keys: |
          site-last-good-

    # Tee toorcache'i staatus logist nähtavaks — kui outage päev tuleb
    # ja R-pool kaebab "toorcache puudub", on selge kohe siit, kas:
    #   (a) cache evicti läbi (7p inaktiivsust), või
    #   (b) skeemi-bumb jättis prefiksi sobimatuks, või
    #   (c) tegu ongi esimese run'iga peale deploy'i.
    # ::warning'iga eemaldatud cache on tabletop'is kohe näha.
    - name: Show raw cache status
      if: always()
      shell: bash
      run: |
        for f in cache_inflation_raw.rds cache_nav_raw.rds; do
          if [ -f "$f" ]; then
            echo "$f olemas: $(stat -c%s "$f") baiti, mtime $(date -r "$f" -u +%FT%TZ)"
          else
            echo "::warning::$f puudub — outage fallback selle runi jaoks ei tööta"
          fi
        done

    # SKIP_UPLOAD=1: vana Zone SCP on välja lülitatud — seppo.ai serveerib
    # aruandeid Cloudflare'ist (vt samm "Deploy reports to Cloudflare").
    - name: Run Analysis in Docker
      run: |
        docker run --rm \
          --env SKIP_UPLOAD=1 \
          --volume "${{ github.workspace }}:/home/rstudio/project" \
          --workdir "/home/rstudio/project" \
          "${{ env.ANALYSIS_IMAGE }}" \
          bash -c "
            set -euo pipefail

            echo '--- Temporarily disabling renv by renaming trigger files ---'
            [ -f .Rprofile ] && mv .Rprofile .Rprofile.bak
            [ -d renv ] && mv renv renv.bak

            echo '--- Running canonical pipeline ---'
            Rscript run_turuylevaade.R

            echo '--- Done ---'
          "

    # Kui fond kadus Pensionikeskuse ekspordist (suleti/ühendati), kirjutas
    # turuylevaade.qmd tema ajaloo arhiivi. Commitime selle, et see säiliks.
    - name: Commit closed-fund archive
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        f=data/ii_suletud_fondid.csv
        [ -f "$f" ] || exit 0
        git add "$f"
        if git diff --cached --quiet; then echo "Arhiiv muutumatu"; exit 0; fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "data: suletud II samba fondide arhiiv $(date -u +%Y-%m-%d)"
        if ! git pull --rebase --autostash; then git rebase --abort 2>/dev/null || true; fi
        git push || echo "::warning::Arhiivi push ebaõnnestus (arhiiv on cache'is alles)"

    # Avame turuülevaate päris brauseris: kui OJS-graafikud ei joonistu (nt
    # teegi või andmete viga), eemaldame lehe ja stage.mjs avaldab eelmise
    # eduka versiooni.
    - name: Check market overview in browser
      id: browser
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        [ -f turuylevaade.html ] || { echo "::warning::turuylevaade.html puudub"; exit 0; }
        set +e
        python3 -m http.server 8765 >/dev/null 2>&1 &
        srv=$!
        for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8765/ && break; sleep 0.5; done
        # Kaks laiust: lauaarvuti ja mobiili kood on graafikutes eri harudes.
        # Tühi DOM (Chrome puudub/aegus) = kontroll ei õnnestunud, mitte viga lehel.
        halb=0
        for laius in 1300 390; do
          dom=$(timeout 90 google-chrome --headless=new --disable-gpu --no-sandbox \
            --window-size=${laius},3000 --virtual-time-budget=30000 \
            --dump-dom http://localhost:8765/turuylevaade.html 2>/dev/null || true)
          if ! grep -q '</html>' <<<"$dom"; then
            echo "::warning::Brauserikontroll ei õnnestunud (laius $laius) — jätan lehe alles"
            continue
          fi
          # `|| true`: Actions käivitab bashi -e ja pipefail'iga; 0 vastet ≠ viga
          graafikuid=$( (grep -oE '<svg[^>]*class="plot-[0-9a-f]+"' <<<"$dom" || true) | wc -l)
          vigu=$( (grep -oE 'OJS (Runtime )?Error|observablehq--error' <<<"$dom" || true) | wc -l)
          echo "Laius $laius: graafikuid $graafikuid, OJS vigu $vigu"
          if [ "$graafikuid" -lt 8 ] || [ "$vigu" -gt 0 ]; then halb=1; fi
        done
        kill $srv || true
        if [ "$halb" = 1 ]; then
          echo "::error::Turuülevaate graafikud ei joonistunud — avaldan eelmise versiooni"
          echo "failed=true" >> "$GITHUB_OUTPUT"
          rm -f turuylevaade.html
        fi

    # --- Cloudflare: seppo.ai/kihlveod/ ja seppo.ai/tuleva/ ---
    # Eraldi staatiline Worker "seppo-ai-kihlveod" (cloudflare/), mille route'id on
    # täpsemad kui seppo.ai põhisaidil. Staatilised failid on tasuta ja piiranguta.
    # Video läheb R2-sse (staatilised failid ei toeta byte range'i, mida video vajab);
    # Worker loeb selle sealt. Saladused: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
    # Workers Routes: Edit, Workers R2 Storage: Edit), R2_ACCOUNT_ID.
    - name: Stage reports
      id: stage
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        node cloudflare/stage.mjs | tee stage.log
        echo "fallbacks=$(grep -c 'avaldan eelmise eduka versiooni\|varukoopiat pole' stage.log || true)" >> "$GITHUB_OUTPUT"
        if [ -f cloudflare/public/kihlveod/tuleva.html ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::tuleva.html puudub ka varukoopias — seppo.ai jääb eelmisesse seisu"
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy reports to Cloudflare
      id: cf
      if: ${{ always() && steps.stage.outputs.ready == 'true' }}
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
          echo "::warning::CLOUDFLARE_API_TOKEN puudub — seppo.ai aruandeid ei uuendata"; exit 0
        fi
        cd cloudflare
        if [ -d media ]; then
          find media -type f | while IFS= read -r f; do
            npx --yes wrangler@4 r2 object put "seppo-ai-files/${f#media/}" --file "$f" --remote
          done
        fi
        npx --yes wrangler@4 deploy
        echo "deployed=true" >> "$GITHUB_OUTPUT"

    - name: Prepare last good site
      if: ${{ always() && steps.cf.outputs.deployed == 'true' }}
      shell: bash
      run: |
        rm -rf cloudflare/last-good
        cp -r cloudflare/public cloudflare/last-good

    - name: Save last good site
      if: ${{ always() && steps.cf.outputs.deployed == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: cloudflare/last-good
        key: site-last-good-${{ github.run_id }}

    # --- GitHub Pages: avaldame raportid (tuleva juurena, teised failinimega) ---
    - name: Assemble GitHub Pages site
      id: site
      if: ${{ always() && steps.stage.outputs.ready == 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        # Sama komplekt mis Cloudflare'is (stage.mjs, sh eelmise eduka versiooni
        # varu). tuleva.html on juur, teised failinimega kõrval.
        mkdir -p _site
        cp -r cloudflare/public/tuleva/. _site/
        rm -f _site/index.html
        cp -r cloudflare/public/kihlveod/. _site/
        cp _site/tuleva.html _site/index.html
        [ -d cloudflare/media/kihlveod ] && cp -r cloudflare/media/kihlveod/. _site/ || true
        echo "ready=true" >> "$GITHUB_OUTPUT"
        ls -la _site

    - name: Setup Pages
      if: ${{ always() && steps.site.outputs.ready == 'true' }}
      uses: actions/configure-pages@v6
      with:
        enablement: true

    - name: Archive Pages artifact
      if: ${{ always() && steps.site.outputs.ready == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        tar \
          --dereference \
          --hard-dereference \
          --directory _site \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          .

    - name: Upload Pages artifact
      if: ${{ always() && steps.site.outputs.ready == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: github-pages
        path: ${{ runner.temp }}/artifact.tar
        retention-days: 1
        if-no-files-found: error

    - name: Deploy to GitHub Pages
      id: deployment
      if: ${{ always() && steps.site.outputs.ready == 'true' }}
      uses: actions/deploy-pages@v5

    # --- Heartbeat: hoiab ajastatud töövoo elus ---
    # GitHub keelab ajastatud (schedule) töövood, kui repos pole 60 päeva
    # olnud ühtegi commiti. Kirjutame iga ~30 päeva tagant heartbeat.txt'i
    # tänase kuupäeva ja commitime — nii on repo tegevuseaeg alati värske
    # ja töövoog jääb ajastusse alles. GITHUB_TOKEN'iga tehtud commit
    # uuendab pushed_at ajatemplit, kuid ei käivita uusi töövoogusid
    # (rekursiooni pole karta).
    - name: Heartbeat commit
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        viimane_epoch=0
        if [ -f heartbeat.txt ]; then
          viimane=$(head -n1 heartbeat.txt | tr -dc '0-9-')
          viimane_epoch=$(date -u -d "$viimane" +%s 2>/dev/null || echo 0)
        fi
        vanus_paevades=$(( ( $(date -u +%s) - viimane_epoch ) / 86400 ))
        if [ "$vanus_paevades" -lt 30 ]; then
          echo "Heartbeat on $vanus_paevades päeva vana — uut commiti pole vaja."
          exit 0
        fi
        echo "Heartbeat on $vanus_paevades päeva vana — uuendan."
        date -u +"%Y-%m-%d" > heartbeat.txt
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add heartbeat.txt
        git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)"
        git push

    - name: Save market overview cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: |
          cache_ii_fondid.rds
          cache_fund_pev.rds
          data/ii_suletud_fondid.csv
        key: turuylevaade-v1-${{ github.run_id }}

    # Leht jäi saidile, aga vana: jooks punaseks, et tuleks teavituskiri.
    - name: Fail if an old report was published
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.browser.outputs.failed }}" = "true" ] || [ "${{ steps.stage.outputs.fallbacks }}" != "0" ]; then
          echo "::error::Mõni aruanne avaldati eelmisest versioonist (vt hoiatusi ülal)"
          exit 1
        fi
